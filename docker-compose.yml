version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: chronica_postgres
    environment:
      POSTGRES_DB: Chronica_Database
      POSTGRES_USER: chronica_user
      POSTGRES_PASSWORD: Admin@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronica_user -d Chronica_Database"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chronica_network

  # FastAPI Application
  api:
    build: .
    container_name: chronica_api
    environment:
      DATABASE_URL: postgresql+psycopg://chronica_user:Admin%40123@postgres:5432/Chronica_Database
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      API_TITLE: Chronica API
      API_VERSION: 1.0.0
      ENVIRONMENT: development
      DEBUG: "True"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://localhost:8080"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - chronica_network

  # Adminer (Database GUI) - Optional, for database management
  adminer:
    image: adminer
    container_name: chronica_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - chronica_network
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: Chronica_Database
      ADMINER_DEFAULT_USER: chronica_user
      ADMINER_DEFAULT_PASSWORD: Admin@123

volumes:
  postgres_data:

networks:
  chronica_network:
    driver: bridge
