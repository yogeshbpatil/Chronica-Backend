# Alembic configuration file

[alembic]
# path to migration scripts
sqlalchemy.url = 

# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be named with dates
# file_template = %%(rev)s_%%(slug)s_%%(ts_now)s

# sys.path path, will be prepended to sys.path if present
# default to the current working directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to zoneinfo.ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's auto-generated by Alembic.
# set to 0 to disable, None to read the value from the
# environment variable ALEMBIC_TRUNCATE_SLUG_FROM - if
# the variable is not set, it defaults to "mako" being the default
# value
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# logging configuration
# Logging level for sqlalchemy.engine is ERROR by default
log_level = INFO

# run_migrations_online() will operate in either 'change to' or 'change from' mode
# if False or omitted, it will default to 'change to'
# change_to_or_change_from_mode = False

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
